name: Unity tests

# Runs all EditMode tests inside Unity via GameCI. Skips cleanly until the Unity licence secrets exist.
# Secrets (repo → Settings → Secrets and variables → Actions): UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
# See https://game.ci/docs/github/activation for creating UNITY_LICENSE with a free Personal licence.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  editmode:
    name: EditMode (Unity)
    runs-on: ubuntu-latest
    steps:
      - name: Check for Unity licence secret
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: echo "present=$([ -n "$UNITY_LICENSE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.licence.outputs.present == 'true'

      - uses: actions/cache@v4
        if: steps.licence.outputs.present == 'true'
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        if: steps.licence.outputs.present == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
